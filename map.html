<!DOCTYPE html>
<html>
<head>
  <title>Kenya Aviation Map</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://unpkg.com/papaparse@5.3.2/papaparse.min.js"></script>
<script src="https://unpkg.com/leaflet-rotatedmarker/leaflet.rotatedMarker.js"></script>

  <style>
    body {
      margin: 0;
      background-color: var(--bg);
      font-family: var(--font-body);
      overflow: hidden;
    }

    #map { height: 100vh; width: 100%; }

    /* ── DATE & TIME FILTER WIDGET ── */
    #dtf-widget {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1002;
      font-family: var(--font-body);
    }
    #dtf-trigger {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px 14px;
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-2);
      font-size: 12px;
      font-weight: 600;
      font-family: var(--font-body);
      cursor: pointer;
      white-space: nowrap;
      box-shadow: var(--shadow);
      transition: background .15s, color .15s;
    }
    #dtf-trigger:hover { background: var(--bg-hover); color: var(--text); }
    #dtf-trigger svg { width: 13px; height: 13px; fill: currentColor; flex-shrink: 0; }
    #dtf-trigger .dtf-chev {
      width: 10px; height: 10px;
      fill: none; stroke: currentColor; stroke-width: 2.5;
      transition: transform .2s;
      flex-shrink: 0;
    }
    #dtf-trigger.dtf-open .dtf-chev { transform: rotate(180deg); }

    #dtf-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 6px 24px rgba(0,0,0,.35);
      overflow: hidden;
      min-width: 260px;
    }
    #dtf-dropdown.dtf-show { display: block; }

    .dtf-menu-item {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 10px 14px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-2);
      cursor: pointer;
      transition: background .12s, color .12s;
      border-bottom: 1px solid var(--border);
    }
    .dtf-menu-item:last-child { border-bottom: none; }
    .dtf-menu-item:hover { background: var(--bg-hover); color: var(--text); }
    .dtf-menu-item svg { width: 13px; height: 13px; fill: currentColor; flex-shrink: 0; }
    .dtf-menu-item .dtf-item-chev {
      width: 10px; height: 10px;
      fill: none; stroke: currentColor; stroke-width: 2.5;
      margin-left: auto; flex-shrink: 0;
      transition: transform .2s;
    }
    .dtf-menu-item.dtf-active { background: var(--accent-dim); color: var(--accent); }
    .dtf-menu-item.dtf-active .dtf-item-chev { transform: rotate(90deg); }

    .dtf-panel {
      display: none;
      padding: 12px 14px 13px;
      border-top: 1px solid var(--border);
      background: var(--bg-3);
    }
    .dtf-panel.dtf-panel-show { display: block; }
    .dtf-panel-title {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--text-3);
      margin-bottom: 9px;
    }
    .dtf-row {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 7px;
      font-size: 11.5px;
      color: var(--text-2);
    }
    .dtf-row:last-child { margin-bottom: 0; }
    .dtf-label { width: 34px; flex-shrink: 0; font-weight: 600; }
    .dtf-row input[type=date] {
      flex: 1;
      padding: 5px 8px;
      border-radius: 5px;
      border: 1px solid var(--border-2);
      background: var(--bg-2);
      color: var(--text);
      font-size: 11.5px;
      font-family: var(--font-body);
      outline: none;
    }
    .dtf-row input[type=date]:focus { border-color: var(--accent); }
    .dtf-actions { display: flex; gap: 6px; margin-top: 10px; }
    .dtf-btn {
      flex: 1;
      padding: 6px 10px;
      border: none;
      border-radius: 5px;
      font-size: 11.5px;
      font-weight: 600;
      font-family: var(--font-body);
      cursor: pointer;
      transition: background .12s;
    }
    .dtf-btn-apply { background: var(--accent); color: #fff; }
    .dtf-btn-apply:hover { background: var(--accent-h, var(--accent)); opacity: .9; }
    .dtf-btn-reset { background: var(--bg-hover); color: var(--text-2); border: 1px solid var(--border); }
    .dtf-btn-reset:hover { color: var(--text); }

    /* SEARCH UI */
    .search-box {
      position: absolute;
      top: 15px;
      left: 50px;
      z-index: 1100;
      background: var(--bg-2);
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 8px;
      display: flex;
      gap: 8px;
    }
    .search-box input {
      padding: 6px 10px;
      border-radius: 5px;
      border: 1px solid var(--border-2);
      background: var(--bg-3);
      color: var(--text);
      width: 220px;
    }
    .search-box input::placeholder { color: var(--text-3); }
    .search-box button {
      padding: 6px 10px;
      border: none;
      border-radius: 5px;
      background: var(--accent);
      color: white;
      cursor: pointer;
    }

    /* TOGGLE */
    .toggle-box {
      position: absolute;
      top: 70px;
      left: 50px;
      z-index: 1100;
      background: var(--bg-2);
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 8px;
      color: var(--text);
    }

    /* SIDE PANEL */
    #infoPanel {
      position: absolute;
      left: 0;
      top: 135px;   /* clears search bar (top 15→66 px) + focus toggle (top 70→108 px) */
      bottom: 0;
      width: 560px;
      background: var(--bg-2);
      color: var(--text);
      overflow-y: auto;
      z-index: 1000;
      transition: transform 0.35s ease;
      transform: translateX(-100%);
      box-shadow: 4px 0 24px rgba(0,0,0,.5);
      font-family: var(--font-body);
      font-size: 13px;
      border-right: 1px solid var(--border);
      border-top: 1px solid var(--border);
      border-top-right-radius: 10px;
    }
    #infoPanel.show { transform: translateX(0); }
    #infoPanel::-webkit-scrollbar { width: 4px; }
    #infoPanel::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 2px; }

    #closePanel {
      background: var(--bg-3);
      border: 1px solid var(--border);
      color: var(--text-2);
      width: 24px; height: 24px;
      border-radius: 50%;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: bold;
      float: right;
      margin: 8px 10px 0 0;
      flex-shrink: 0;
    }
    #closePanel:hover { background: var(--bg-hover); color: var(--text); }

    /* Accordion */
    .acc-section { border-bottom: 1px solid var(--border); }
    .acc-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 13px 18px;
      cursor: pointer; user-select: none;
      background: var(--bg-2);
      transition: background .15s;
    }
    .acc-header:hover { background: var(--bg-hover); }
    .acc-title { font-size: 14px; font-weight: 600; color: var(--accent); }
    .acc-chevron { font-size: 11px; color: var(--text-2); transition: transform .2s; }
    .acc-chevron.open { transform: rotate(180deg); }
    .acc-body { display: none; padding: 0 18px 16px; font-size: 12.5px; line-height: 1.6; color: var(--text); }
    .acc-body.open { display: block; }

    /* Panel header */
    .panel-airport-name { font-size: 12px; font-weight: 700; text-transform: uppercase; color: var(--accent); letter-spacing: .04em; }
    .panel-airport-city { font-size: 11px; color: var(--text-2); margin-top: 1px; }

    /* Risk fields */
    .ra-header-row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 10px; }
    .ra-field { font-size: 12px; }
    .ra-label { color: var(--text-2); font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; }
    .ra-value { font-weight: 600; color: var(--text); }
    .ra-value.status-green { background: #16a34a; color: white; padding: 1px 8px; border-radius: 3px; display: inline-block; }
    .ra-value.status-amber { background: #d97706; color: white; padding: 1px 8px; border-radius: 3px; display: inline-block; }
    .ra-value.status-red   { background: #dc2626; color: white; padding: 1px 8px; border-radius: 3px; display: inline-block; }

    /* CIA table */
    .cia-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 10px; }
    .cia-table thead tr { background: var(--bg-3); color: var(--text-2); }
    .cia-table th { padding: 7px 10px; text-align: left; font-weight: 600; font-size: 11.5px; }
    .cia-table td { padding: 7px 10px; border-bottom: 1px solid var(--border); vertical-align: top; color: var(--text); }
    .cia-table tr:nth-child(even) td { background: var(--bg-3); }
    .cia-table td:first-child { font-weight: 600; white-space: nowrap; width: 38%; }

    /* Section heading & info table */
    .sec-heading { font-size: 12px; font-weight: 700; color: var(--accent); margin: 14px 0 6px; padding-bottom: 4px; border-bottom: 1px solid var(--border); }
    .info-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .info-table th { text-align: left; color: var(--text); font-weight: 700; padding: 5px 0; border-bottom: 1px solid var(--border); }
    .info-table td { padding: 5px 0 5px 10px; border-bottom: 1px solid var(--border); vertical-align: top; color: var(--text-2); }
    .info-table td:first-child { padding-left: 0; font-weight: 500; color: var(--text); width: 38%; }

    /* Risk bar */
    .rs-bar-wrap { margin: 10px 0 6px; }
    .rs-bar-track { height: 7px; background: var(--bg-3); border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
    .rs-bar-fill { height: 100%; border-radius: 4px; transition: width .4s; }

    .exposure-note { color: var(--accent); font-style: italic; font-size: 12px; margin-top: 10px; line-height: 1.55; }
    .ra-bullets { margin: 8px 0 0 14px; padding: 0; font-size: 12.5px; line-height: 1.6; }
    .ra-bullets li { margin-bottom: 4px; }


    /* Full path button */
    .path-btn { display:inline-flex;align-items:center;gap:5px;margin-top:10px;padding:5px 12px;border-radius:5px;background:rgba(99,102,241,.12);color:#818cf8;border:1px solid rgba(99,102,241,.3);font-size:10.5px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;width:100%;justify-content:center;transition:background .15s; }
    .path-btn:hover { background:rgba(99,102,241,.22); }
    .path-btn.active { background:rgba(99,102,241,.3);color:#a5b4fc; }
    /* Custom popup */
    .custom-popup .leaflet-popup-content-wrapper {
      background: var(--bg-2);
      padding: 0;
      border-radius: 10px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 20px rgba(0,0,0,.4);
      overflow: hidden;
      width: 620px;
      max-width: 90vw;
    }
    .custom-popup .leaflet-popup-content { margin: 0; width: 100% !important; }
    .custom-popup .leaflet-popup-tip-container { display: none; }

    .pu-img { width: 100%; height: auto; display: block; }
    .pu-body { padding: 10px 14px 12px; }
    .pu-name { font-size: 12.5px; font-weight: 700; text-transform: uppercase; color: var(--text); letter-spacing: .04em; margin-bottom: 2px; }
    .pu-icao { font-size: 10px; color: var(--text-2); margin-bottom: 7px; }
    .pu-info-table { width: 100%; border-collapse: collapse; font-size: 10.5px; margin-bottom: 2px; }
    .pu-info-label { color: var(--text-2); padding: 2px 4px 2px 0; white-space: nowrap; width: 22%; }
    .pu-info-val   { color: var(--text); font-weight: 600; padding: 2px 8px 2px 2px; }
    .pu-divider    { border: none; border-top: 1px solid var(--border); margin: 7px 0; }
    .pu-additional { display: flex; align-items: center; justify-content: space-between; margin-bottom: 7px; }
    .pu-additional-label { font-size: 11px; font-weight: 600; color: var(--accent); }
    .pu-additional-hint  { font-size: 10.5px; color: var(--text-2); font-style: italic; }
    .pu-btn {
      display: block; width: 100%; margin-top: 2px;
      padding: 7px; text-align: center; font-size: 12px; font-weight: 700;
      background: var(--accent); color: white; border: none;
      border-radius: 6px; cursor: pointer; transition: background .15s; letter-spacing: .02em;
    }
    .pu-btn:hover { background: var(--accent-h); }

    /* Right panel — redesigned layout */
    .rp-header { padding: 12px 16px 10px; border-bottom: 1px solid var(--border); }
    .rp-name { font-size: 13px; font-weight: 700; text-transform: uppercase; color: var(--text); letter-spacing: .04em; line-height:1.3; }
    .rp-city { font-size: 11.5px; color: var(--text-2); margin-top: 3px; font-weight:600; letter-spacing:.06em; }
    .rp-section { padding: 12px 18px; border-bottom: 1px solid var(--border); }
    .rp-sec-heading { font-size: 11.5px; font-weight: 700; color: var(--text); text-transform: uppercase;
                      letter-spacing: .06em; margin-bottom: 8px; padding-bottom: 4px; border-bottom: 1px solid var(--border); }
    .rp-narrative { font-size: 12.5px; line-height: 1.7; color: var(--text); margin: 0; }

    /* Summary table */
    .rp-summary-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .rp-sum-label { color: var(--text-2); font-size: 11px; font-weight: 600; text-transform: uppercase;
                    letter-spacing: .04em; padding: 5px 12px 5px 0; vertical-align: top; white-space: nowrap; width: 38%; }
    .rp-sum-val   { color: var(--text); font-weight: 600; padding: 5px 0; vertical-align: top; }
    .rp-summary-table tr { border-bottom: 1px solid var(--border); }
    .rp-summary-table tr:last-child { border-bottom: none; }

    /* Status bar */
    .status-bar { display: block; width: 100%; padding: 4px 10px; border-radius: 4px;
                  font-weight: 700; font-size: 11.5px; letter-spacing: .06em; text-align: center; }
    .status-bar-green { background: #16a34a; color: #fff; }
    .status-bar-amber { background: #d97706; color: #fff; }
    .status-bar-red   { background: #dc2626; color: #fff; }

    /* Domain table */
    .rp-domain-table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
    .rp-domain-table thead tr { background: var(--bg-3); }
    .rp-domain-table th { padding: 6px 8px; text-align: left; font-weight: 700; font-size: 11px;
                          color: var(--text-2); border-bottom: 1px solid var(--border); }
    .rp-domain-table td { padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; color: var(--text); }
    .rp-domain-table tr:nth-child(even) td { background: var(--bg-3); }
    .rp-domain-table td:first-child { font-weight: 600; white-space: nowrap; }
    .domain-lxi { font-family: monospace; font-weight: 700; font-size: 11px; white-space: nowrap; }

    /* General info table for panel */
    .rp-info-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .rp-info-table thead tr { background: var(--bg-3); }
    .rp-info-table th { padding: 6px 8px; text-align: left; font-weight: 700; font-size: 11px;
                        color: var(--text-2); border-bottom: 1px solid var(--border); }
    .rp-info-table td { padding: 6px 8px; border-bottom: 1px solid var(--border); vertical-align: top; color: var(--text); }
    .rp-info-table tr:nth-child(even) td { background: var(--bg-3); }
    .rp-info-table td:first-child { font-weight: 600; white-space: nowrap; width: 35%; }

    /* Impact severity bands */
    /* badge spans — used outside the domain table */
    .band-low     { background: #16a34a; color: #fff; padding: 1px 7px; border-radius: 3px; font-size: 10.5px; font-weight: 700; display: inline-block; }
    .band-medium  { background: #d97706; color: #fff; padding: 1px 7px; border-radius: 3px; font-size: 10.5px; font-weight: 700; display: inline-block; }
    .band-high    { background: #ea580c; color: #fff; padding: 1px 7px; border-radius: 3px; font-size: 10.5px; font-weight: 700; display: inline-block; }
    .band-extreme { background: #dc2626; color: #fff; padding: 1px 7px; border-radius: 3px; font-size: 10.5px; font-weight: 700; display: inline-block; }
    /* full-cell colour for the Impact Severity Band column in the domain table */
    .rp-domain-table td.band-cell-low     { background: #16a34a !important; color: #fff; font-weight: 700; font-size: 11px; text-align: center; white-space: nowrap; }
    .rp-domain-table td.band-cell-medium  { background: #d97706 !important; color: #fff; font-weight: 700; font-size: 11px; text-align: center; white-space: nowrap; }
    .rp-domain-table td.band-cell-high    { background: #ea580c !important; color: #fff; font-weight: 700; font-size: 11px; text-align: center; white-space: nowrap; }
    .rp-domain-table td.band-cell-extreme { background: #dc2626 !important; color: #fff; font-weight: 700; font-size: 11px; text-align: center; white-space: nowrap; }

    /* Risk Matrix */
    .rm-wrap   { margin-top: 8px; }
    .rm-hdr    { font-size: 9.5px; color: var(--text-2); margin-bottom: 6px; font-weight: 500; line-height: 1.5; }
    .rm-tbl    { border-collapse: separate; border-spacing: 3px; table-layout: fixed; width: 100%; }
    .rm-corner { width: 46px; font-size: 7px; font-weight: 500; color: var(--text-3); text-align: center;
                 line-height: 1.35; padding: 0 2px 2px 0; vertical-align: bottom; }
    .rm-th     { font-size: 10px; font-weight: 700; color: var(--text-2); text-align: center; padding: 0 0 3px; }
    .rm-lh     { width: 50px; font-size: 8px; color: var(--text-3); text-align: right;
                 padding-right: 5px; vertical-align: middle; line-height: 1.4; white-space: nowrap; }
    .rm-lh b   { display: block; font-size: 10px; font-weight: 700; color: var(--text-2); line-height: 1.1; }
    .rm-cell   { font-size: 10px; font-weight: 600; text-align: center; padding: 4px 2px;
                 color: white; border-radius: 3px; vertical-align: middle; }

    /* Risk colours */
    .risk-low     { background: #16a34a; }
    .risk-mod     { background: #d97706; }
    .risk-high    { background: #ea580c; }
    .risk-extreme { background: #dc2626; }

    /* Risk text & gauge */
    .risk-text { font-size: 12px; color: var(--text); line-height: 1.4; }
    .risk-row { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
    .gauge-wrap { width: 80px; text-align: center; }
    .gauge { position: relative; width: 80px; height: 40px; overflow: hidden; }
    .gauge-arc {
      position: absolute; inset: 0;
      border-radius: 110px 110px 0 0;
      background: conic-gradient(from 180deg, #22c55e 45deg, #eab308 90deg, #f97316 135deg, #ef4444 180deg);
    }
    .gauge::after {
      content: ""; position: absolute; left: 7px; top: 7px;
      width: 66px; height: 33px;
      background: var(--bg-2);
      border-radius: 90px 90px 0 0; z-index: 1;
    }
    .gauge-needle {
      position: absolute; left: 50%; bottom: 0;
      width: 2px; height: 30px;
      background: var(--text);
      transform-origin: bottom center;
      transform: translateX(-50%) rotate(calc(var(--score) * 180deg - 90deg));
      z-index: 2; border-radius: 2px;
    }
    .gauge-center {
      position: absolute; left: 50%; bottom: -1px;
      width: 7px; height: 7px;
      background: var(--text); border-radius: 50%;
      transform: translateX(-50%); z-index: 3;
    }
    .gauge-label { font-size: 12px; font-weight: bold; margin-top: 6px; color: var(--text); }

    .risk-button {
      display: block; margin-top: 10px; padding: 5px 10px;
      background: var(--accent); color: white;
      text-align: center; border-radius: 10px;
      font-size: 12px; font-weight: 600; border: none;
      cursor: pointer; width: fit-content; margin-left: auto;
    }

    .popup-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
    a:hover { text-decoration: underline; }

    /* Leaflet UI overrides */
    .leaflet-popup-content-wrapper, .leaflet-popup-tip {
      background: var(--bg-2) !important;
      color: var(--text) !important;
      box-shadow: 0 4px 16px rgba(0,0,0,.4) !important;
    }
    .leaflet-bar a { background: var(--bg-2) !important; color: var(--text) !important; border-color: var(--border) !important; }
    .leaflet-bar a:hover { background: var(--bg-hover) !important; }

    /* Legend */
    .legend {
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 12.5px;
      font-family: var(--font-body);
      box-shadow: var(--shadow);
    }

    /* ── CUSTOM LAYER TREE PANEL ── */
    #layerToggleBtn {
      position: absolute;
      top: 15px;
      right: 10px;
      z-index: 1001;
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-2);
      box-shadow: var(--shadow);
      transition: background .15s, color .15s;
      font-family: var(--font-body);
    }
    #layerToggleBtn:hover { background: var(--bg-hover); color: var(--text); }
    #layerToggleBtn svg { width: 14px; height: 14px; fill: currentColor; flex-shrink:0; }

    #layerPanel {
      position: absolute;
      top: 53px;
      right: 10px;
      z-index: 1001;
      width: 234px;
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,.35);
      overflow: hidden;
      max-height: calc(100vh - 80px);
      display: flex;
      flex-direction: column;
      font-family: var(--font-body);
    }
    #layerPanel.lp-hidden { display: none; }

    #layerPanelHead {
      padding: 9px 14px;
      background: var(--bg-3);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    #layerPanelHead span {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--text-3);
    }

    #layerPanelScroll {
      overflow-y: auto;
      flex: 1;
    }
    #layerPanelScroll::-webkit-scrollbar { width: 3px; }
    #layerPanelScroll::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 2px; }

    /* Base map section */
    .lp-basemap-section { border-bottom: 1px solid var(--border); padding: 6px 0; }
    .lp-basemap-head {
      padding: 5px 14px 3px;
      font-size: 9.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--text-3);
    }
    .lp-basemap-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 14px;
      cursor: pointer;
      transition: background .12s;
    }
    .lp-basemap-row:hover { background: var(--bg-hover); }
    .lp-basemap-row input { cursor: pointer; accent-color: var(--accent); margin: 0; }
    .lp-basemap-label { font-size: 11.5px; color: var(--text-2); }
    .lp-basemap-row:hover .lp-basemap-label { color: var(--text); }

    /* Bucket */
    .lp-bucket { border-bottom: 1px solid var(--border); }
    .lp-bucket:last-child { border-bottom: none; }
    .lp-bucket-head {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 14px;
      cursor: pointer;
      user-select: none;
      background: var(--bg-2);
      transition: background .15s;
    }
    .lp-bucket-head:hover { background: var(--bg-hover); }
    .lp-bucket-ck {
      cursor: pointer;
      accent-color: var(--accent);
      flex-shrink: 0;
      margin: 0;
      width: 13px;
      height: 13px;
    }
    .lp-bucket-icon { width: 15px; height: 15px; flex-shrink: 0; }
    .lp-bucket-label { font-size: 12px; font-weight: 600; color: var(--text); flex: 1; }
    .lp-bucket-chevron {
      width: 12px; height: 12px;
      fill: none; stroke: var(--text-3); stroke-width: 2.5;
      flex-shrink: 0;
      transition: transform .2s;
    }
    .lp-bucket-chevron.lp-open { transform: rotate(180deg); }
    .lp-bucket-body { display: none; padding: 4px 0 8px; }
    .lp-bucket-body.lp-open { display: block; }

    /* Sublayer rows */
    .lp-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 14px 5px 30px;
      cursor: pointer;
      transition: background .12s;
    }
    .lp-row:hover { background: var(--bg-hover); }
    .lp-row input[type=checkbox] { cursor: pointer; accent-color: var(--accent); flex-shrink: 0; margin: 0; }
    .lp-row-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .lp-row-label { font-size: 11.5px; color: var(--text-2); }
    .lp-row:hover .lp-row-label { color: var(--text); }

    /* ── FULLSCREEN BUTTON ── */
    #fullscreenBtn {
      position: absolute;
      bottom: 30px;
      right: 10px;
      z-index: 1001;
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-2);
      box-shadow: var(--shadow);
      transition: background .15s, color .15s;
      font-family: var(--font-body);
      white-space: nowrap;
    }
    #fullscreenBtn:hover { background: var(--bg-hover); color: var(--text); }
    #fullscreenBtn svg { width: 14px; height: 14px; fill: currentColor; flex-shrink: 0; }

    /* Flights dropdown */
    .lp-flights-select {
      display: block;
      margin: 4px 14px 6px 30px;
      background: var(--bg-3);
      border: 1px solid var(--border-2);
      border-radius: 5px;
      padding: 5px 8px;
      font-size: 11.5px;
      color: var(--text);
      width: calc(100% - 44px);
      cursor: pointer;
      font-family: var(--font-body);
      outline: none;
    }
  </style>
</head>

<body>

<!-- SEARCH -->
<div class="search-box">
  <input type="text" id="searchInput" placeholder="Search airport or ICAO">
  <button onclick="searchAirport()">Search</button>
</div>

<!-- TOGGLE -->
<div class="toggle-box">
  <label>
    <input type="checkbox" id="focusMode" onchange="toggleFocusMode()">
    Focus
  </label>
</div>

<!-- DATE & TIME FILTER WIDGET -->
<div id="dtf-widget">
  <button id="dtf-trigger" onclick="toggleDTFDropdown()">
    <svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm0 18H5V9h14v12zM5 7V5h14v2H5zm2 4h10v2H7v-2zm0 4h7v2H7v-2z"/></svg>
    Date &amp; Time Filter
    <svg class="dtf-chev" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
  </button>

  <div id="dtf-dropdown">
    <!-- Menu items -->
    <div class="dtf-menu-item" id="dtf-item-acled" onclick="toggleDTFPanel('acled')">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/></svg>
      ACLED Filter
      <svg class="dtf-item-chev" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
    </div>
    <div id="dtf-panel-acled" class="dtf-panel">
      <div class="dtf-panel-title">ACLED Security Events</div>
      <div class="dtf-row">
        <span class="dtf-label">From</span>
        <input type="date" id="acledFrom">
      </div>
      <div class="dtf-row">
        <span class="dtf-label">To</span>
        <input type="date" id="acledTo">
      </div>
      <div class="dtf-actions">
        <button class="dtf-btn dtf-btn-apply" onclick="applyACLEDDateFilter()">Apply</button>
        <button class="dtf-btn dtf-btn-reset" onclick="resetACLEDFilter()">Reset</button>
      </div>
    </div>

    <!-- ASN -->
    <div class="dtf-menu-item" id="dtf-item-asn" onclick="toggleDTFPanel('asn')">
      <svg viewBox="0 0 24 24"><path d="M21 3L3 10.53v.98l6.84 2.65L12.48 21h.98L21 3z"/></svg>
      ASN Filter
      <svg class="dtf-item-chev" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
    </div>
    <div id="dtf-panel-asn" class="dtf-panel">
      <div class="dtf-panel-title">ASN Aviation Incidents</div>
      <div class="dtf-row">
        <span class="dtf-label">From</span>
        <input type="date" id="asnFrom">
      </div>
      <div class="dtf-row">
        <span class="dtf-label">To</span>
        <input type="date" id="asnTo">
      </div>
      <div class="dtf-actions">
        <button class="dtf-btn dtf-btn-apply" onclick="applyASNDateFilter()">Apply</button>
        <button class="dtf-btn dtf-btn-reset" onclick="resetASNFilter()">Reset</button>
      </div>
    </div>
  </div>
</div>

<div id="map"></div>
<!-- Floating clear-path banner -->
<div id="clearTrackBanner" onclick="clearAllPaths()" style="display:none;position:absolute;bottom:32px;left:50%;transform:translateX(-50%);z-index:1100;background:#1e293b;color:#fff;border:1px solid rgba(129,140,248,.4);border-radius:20px;padding:7px 18px;font-size:12px;font-weight:600;align-items:center;gap:10px;box-shadow:0 4px 16px rgba(0,0,0,.5);cursor:pointer;white-space:nowrap;">
  <span style="color:#818cf8;">🗺</span> Path active &nbsp;·&nbsp; <span style="color:#f87171;">✕ Clear</span>
</div>

<!-- Layer Tree Toggle Button -->
<button id="layerToggleBtn" onclick="toggleLayerPanel()">
  <svg viewBox="0 0 24 24"><path d="M3 6h18v2H3V6zm3 5h12v2H6v-2zm3 5h6v2H9v-2z"/></svg>
  Layers
</button>

<!-- Custom Layer Tree Panel -->
<div id="layerPanel">
  <div id="layerPanelHead"><span>Map Layers</span></div>
  <div id="layerPanelScroll">

    <!-- Basemap -->
    <div class="lp-basemap-section">
      <div class="lp-basemap-head">Base Map</div>
      <label class="lp-basemap-row"><input type="radio" name="basemap" value="osm" checked onchange="setBaseMap('osm')"><span class="lp-basemap-label">OpenStreetMap</span></label>
      <label class="lp-basemap-row"><input type="radio" name="basemap" value="light" onchange="setBaseMap('light')"><span class="lp-basemap-label">Light</span></label>
      <label class="lp-basemap-row"><input type="radio" name="basemap" value="dark" onchange="setBaseMap('dark')"><span class="lp-basemap-label">Dark</span></label>
      <label class="lp-basemap-row"><input type="radio" name="basemap" value="satellite" onchange="setBaseMap('satellite')"><span class="lp-basemap-label">Satellite (Esri)</span></label>
    </div>

    <!-- Bucket: Airfields -->
    <div class="lp-bucket">
      <div class="lp-bucket-head" onclick="toggleBucket('airfields')">
        <input type="checkbox" class="lp-bucket-ck" checked onclick="toggleBucketLayers('airfields',this.checked,event)">
        <svg class="lp-bucket-icon" viewBox="0 0 24 24" fill="#dc2626"><path d="M2.5 19h19v2h-19zm7.18-1.73l4.35 1.16 5.31 1.42c.8.21 1.62-.26 1.84-1.06.21-.8-.26-1.62-1.06-1.84l-3.77-1.01-2.89-4.86-1.45.39.89 4.34-3.27-.87-.87-1.73-1.09.29.96 3.78z"/></svg>
        <span class="lp-bucket-label">Airfields</span>
        <svg class="lp-bucket-chevron lp-open" id="chev-airfields" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div class="lp-bucket-body lp-open" id="body-airfields">
        <label class="lp-row"><input type="checkbox" checked onchange="toggleLayer('major',this.checked)"><svg viewBox="0 0 24 24" width="14" height="14" style="flex-shrink:0"><path d="M2.5 19h19v2h-19zm7.18-1.73l4.35 1.16 5.31 1.42c.8.21 1.62-.26 1.84-1.06.21-.8-.26-1.62-1.06-1.84l-3.77-1.01-2.89-4.86-1.45.39.89 4.34-3.27-.87-.87-1.73-1.09.29.96 3.78z" fill="#dc2626"/></svg><span class="lp-row-label">Major Airports</span></label>
        <label class="lp-row"><input type="checkbox" checked onchange="toggleLayer('minor',this.checked)"><svg viewBox="0 0 24 24" width="14" height="14" style="flex-shrink:0"><path d="M2.5 19h19v2h-19zm7.18-1.73l4.35 1.16 5.31 1.42c.8.21 1.62-.26 1.84-1.06.21-.8-.26-1.62-1.06-1.84l-3.77-1.01-2.89-4.86-1.45.39.89 4.34-3.27-.87-.87-1.73-1.09.29.96 3.78z" fill="#2563eb"/></svg><span class="lp-row-label">Minor Airports</span></label>
        <label class="lp-row"><input type="checkbox" checked onchange="toggleLayer('airbase',this.checked)"><svg viewBox="0 0 24 24" width="14" height="14" style="flex-shrink:0"><path d="M2.5 19h19v2h-19zm7.18-1.73l4.35 1.16 5.31 1.42c.8.21 1.62-.26 1.84-1.06.21-.8-.26-1.62-1.06-1.84l-3.77-1.01-2.89-4.86-1.45.39.89 4.34-3.27-.87-.87-1.73-1.09.29.96 3.78z" fill="#16a34a"/></svg><span class="lp-row-label">Air Bases</span></label>
        <label class="lp-row"><input type="checkbox" checked onchange="toggleLayer('airstrip',this.checked)"><svg viewBox="0 0 24 24" width="14" height="14" style="flex-shrink:0"><path d="M2.5 19h19v2h-19zm7.18-1.73l4.35 1.16 5.31 1.42c.8.21 1.62-.26 1.84-1.06.21-.8-.26-1.62-1.06-1.84l-3.77-1.01-2.89-4.86-1.45.39.89 4.34-3.27-.87-.87-1.73-1.09.29.96 3.78z" fill="#92400e"/></svg><span class="lp-row-label">Airstrips</span></label>
      </div>
    </div>

    <!-- Bucket: Live Flights -->
    <div class="lp-bucket">
      <div class="lp-bucket-head" onclick="toggleBucket('live-flights')">
        <input type="checkbox" class="lp-bucket-ck" onclick="toggleBucketLayers('live-flights',this.checked,event)">
        <svg class="lp-bucket-icon" viewBox="0 0 24 24" fill="#10b981"><path d="M21 16v-2l-8-5V3.5A1.5 1.5 0 0 0 11.5 2 1.5 1.5 0 0 0 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg>
        <span class="lp-bucket-label">Live Flights</span>
        <svg class="lp-bucket-chevron lp-open" id="chev-live-flights" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div class="lp-bucket-body lp-open" id="body-live-flights">
        <label class="lp-row"><input type="radio" name="flightMode" value="all" checked onchange="setFlightFilter('all')"><span class="lp-row-dot" style="background:#94a3b8"></span><span class="lp-row-label">All Airlines</span></label>
        <label class="lp-row"><input type="radio" name="flightMode" value="KQ" onchange="setFlightFilter('KQ')"><span class="lp-row-dot" style="background:#CC0001"></span><span class="lp-row-label" id="kqFilterLabel">Kenya Airways</span></label>
        <label class="lp-row"><input type="radio" name="flightMode" value="ET" onchange="setFlightFilter('ET')"><span class="lp-row-dot" style="background:#009B3A"></span><span class="lp-row-label">Ethiopian Airlines</span></label>
        <label class="lp-row"><input type="radio" name="flightMode" value="U7" onchange="setFlightFilter('U7')"><span class="lp-row-dot" style="background:#FCDC04"></span><span class="lp-row-label">Uganda Airlines</span></label>
        <label class="lp-row"><input type="radio" name="flightMode" value="WB" onchange="setFlightFilter('WB')"><span class="lp-row-dot" style="background:#20C4F4"></span><span class="lp-row-label">RwandAir</span></label>
        <label class="lp-row"><input type="radio" name="flightMode" value="TC" onchange="setFlightFilter('TC')"><span class="lp-row-dot" style="background:#1BB4E8"></span><span class="lp-row-label">Air Tanzania</span></label>
        <label class="lp-row"><input type="radio" name="flightMode" value="JM" onchange="setFlightFilter('JM')"><span class="lp-row-dot" style="background:#FF5500"></span><span class="lp-row-label">Jambojet</span></label>
        <label class="lp-row"><input type="radio" name="flightMode" value="SL" onchange="setFlightFilter('SL')"><span class="lp-row-dot" style="background:#1A6FE8"></span><span class="lp-row-label">Skyline Express</span></label>
        <label class="lp-row"><input type="radio" name="flightMode" value="PW" onchange="setFlightFilter('PW')"><span class="lp-row-dot" style="background:#E8821B"></span><span class="lp-row-label">Precision Air</span></label>
        <div id="flightStatusBadge" style="margin:3px 14px 4px 30px;font-size:10px;color:var(--text-3);display:none;"></div>
      </div>
    </div>

    <!-- Bucket: Live Updates -->
    <div class="lp-bucket">
      <div class="lp-bucket-head" onclick="toggleBucket('live-updates')">
        <input type="checkbox" class="lp-bucket-ck" onclick="toggleBucketLayers('live-updates',this.checked,event)">
        <svg class="lp-bucket-icon" viewBox="0 0 24 24" fill="#f59e0b"><path d="M13 2.05v2.02c3.95.49 7 3.85 7 7.93s-3.05 7.44-7 7.93v2.02c5.05-.5 9-4.76 9-9.95S18.05 2.55 13 2.05zM11 2.05C5.95 2.55 2 6.81 2 12s3.95 9.45 9 9.95v-2.02C7.05 19.43 4 16.07 4 12s3.05-7.44 7-7.93V2.05zM12 6l-5 9h10L12 6z"/></svg>
        <span class="lp-bucket-label">Live Updates</span>
        <svg class="lp-bucket-chevron" id="chev-live-updates" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div class="lp-bucket-body" id="body-live-updates">
        <label class="lp-row"><input type="checkbox" onchange="toggleLayer('weather',this.checked)"><span class="lp-row-dot" style="background:#f59e0b"></span><span class="lp-row-label">Weather</span></label>
        <label class="lp-row"><input type="checkbox" onchange="toggleLayer('security-feed',this.checked)"><span class="lp-row-dot" style="background:#ef4444"></span><span class="lp-row-label">Security</span></label>
        <label class="lp-row"><input type="checkbox" onchange="toggleLayer('regulation',this.checked)"><span class="lp-row-dot" style="background:#7c3aed"></span><span class="lp-row-label">Regulation</span></label>
        <label class="lp-row"><input type="checkbox" onchange="toggleLayer('commercial',this.checked)"><span class="lp-row-dot" style="background:#1a6fe8"></span><span class="lp-row-label">Commercial</span></label>
        <label class="lp-row"><input type="checkbox" onchange="toggleLayer('infrastructure',this.checked)"><span class="lp-row-label">Infrastructure</span></label>
      </div>
    </div>

    <!-- Bucket: Aviation Safety -->
    <div class="lp-bucket">
      <div class="lp-bucket-head" onclick="toggleBucket('aviation-safety')">
        <input type="checkbox" class="lp-bucket-ck" onclick="toggleBucketLayers('aviation-safety',this.checked,event)">
        <svg class="lp-bucket-icon" viewBox="0 0 24 24" fill="#2563eb"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg>
        <span class="lp-bucket-label">Aviation Safety</span>
        <svg class="lp-bucket-chevron" id="chev-aviation-safety" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div class="lp-bucket-body" id="body-aviation-safety">
        <label class="lp-row"><input type="checkbox" onchange="toggleLayer('asn',this.checked)"><span class="lp-row-dot" style="background:#ef4444"></span><span class="lp-row-label">ASN Incidents</span></label>
      </div>
    </div>

    <!-- Bucket: Historic Security Events -->
    <div class="lp-bucket">
      <div class="lp-bucket-head" onclick="toggleBucket('security-hist')">
        <input type="checkbox" class="lp-bucket-ck" onclick="toggleBucketLayers('security-hist',this.checked,event)">
        <svg class="lp-bucket-icon" viewBox="0 0 24 24" fill="#ef4444"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>
        <span class="lp-bucket-label">Historic Security Events</span>
        <svg class="lp-bucket-chevron" id="chev-security-hist" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div class="lp-bucket-body" id="body-security-hist">
        <label class="lp-row"><input type="checkbox" onchange="toggleLayer('acled',this.checked)"><span class="lp-row-dot" style="background:#ef4444"></span><span class="lp-row-label">ACLED Events</span></label>
      </div>
    </div>

    <!-- Bucket: Flight Zones -->
    <div class="lp-bucket">
      <div class="lp-bucket-head" onclick="toggleBucket('flight-zones')">
        <input type="checkbox" class="lp-bucket-ck" onclick="toggleBucketLayers('flight-zones',this.checked,event)">
        <svg class="lp-bucket-icon" viewBox="0 0 24 24" fill="#7c3aed"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm0-14c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6zm0 10c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4z"/></svg>
        <span class="lp-bucket-label">Flight Zones</span>
        <svg class="lp-bucket-chevron" id="chev-flight-zones" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div class="lp-bucket-body" id="body-flight-zones">
        <label class="lp-row"><input type="checkbox" onchange="toggleLayer('ctr',this.checked)"><span class="lp-row-dot" style="background:#f97316"></span><span class="lp-row-label">CTR — Control Zones</span></label>
        <label class="lp-row"><input type="checkbox" onchange="toggleLayer('tma',this.checked)"><span class="lp-row-dot" style="background:#5C3317"></span><span class="lp-row-label">TMA — Terminal Areas</span></label>
        <label class="lp-row"><input type="checkbox" onchange="toggleLayer('fir',this.checked)"><span class="lp-row-dot" style="background:#4B0082"></span><span class="lp-row-label">FIR — Flight Info Regions</span></label>
        <label class="lp-row"><input type="checkbox" onchange="toggleLayer('prohibited',this.checked)"><span class="lp-row-dot" style="background:#32CD32"></span><span class="lp-row-label">Prohibited Airspace</span></label>
        <label class="lp-row"><input type="checkbox" onchange="toggleLayer('danger',this.checked)"><span class="lp-row-dot" style="background:#ef4444"></span><span class="lp-row-label">Danger Airspace</span></label>
        <label class="lp-row"><input type="checkbox" onchange="toggleLayer('afis',this.checked)"><span class="lp-row-dot" style="background:#eab308"></span><span class="lp-row-label">AFIS Zones</span></label>
        <label class="lp-row"><input type="checkbox" onchange="toggleLayer('restricted',this.checked)"><span class="lp-row-dot" style="background:#94a3b8"></span><span class="lp-row-label">Restricted Airspace</span></label>
      </div>
    </div>

  </div>
</div>

<!-- FULLSCREEN BUTTON -->
<button id="fullscreenBtn" onclick="toggleFullscreen()">
  <svg id="fsIconExpand" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
  <svg id="fsIconCompress" viewBox="0 0 24 24" style="display:none;"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>

// Generate N+1 points along the great circle between two [lat,lon] pairs
function greatCirclePoints(from, to, n) {
  var toRad = Math.PI / 180, toDeg = 180 / Math.PI;
  var lat1 = from[0] * toRad, lon1 = from[1] * toRad;
  var lat2 = to[0]   * toRad, lon2 = to[1]   * toRad;
  var d = 2 * Math.asin(Math.sqrt(
    Math.pow(Math.sin((lat2 - lat1) / 2), 2) +
    Math.cos(lat1) * Math.cos(lat2) * Math.pow(Math.sin((lon2 - lon1) / 2), 2)
  ));
  if (d < 1e-9) return [from, to]; // same point guard
  var pts = [];
  for (var i = 0; i <= n; i++) {
    var t = i / n;
    var A = Math.sin((1 - t) * d) / Math.sin(d);
    var B = Math.sin(t * d)       / Math.sin(d);
    var x = A * Math.cos(lat1) * Math.cos(lon1) + B * Math.cos(lat2) * Math.cos(lon2);
    var y = A * Math.cos(lat1) * Math.sin(lon1) + B * Math.cos(lat2) * Math.sin(lon2);
    var z = A * Math.sin(lat1) + B * Math.sin(lat2);
    pts.push([
      Math.atan2(z, Math.sqrt(x * x + y * y)) * toDeg,
      Math.atan2(y, x) * toDeg
    ]);
  }
  return pts;
}

function drawFlightPath(cs) {
  var f = simFlightData[cs];
  if (!f || !f.from || !f.to) return;
  clearFlightPath(cs);
  var elapsed  = Math.floor((Date.now() - simPageStart) / 60000);
  var progress = Math.min(1, (f.elapsed0 + elapsed) / f.totalMins);
  // Use 80 segments — enough for a smooth arc on any route length
  var N   = 80;
  var all = greatCirclePoints(f.from, f.to, N);
  var splitIdx = Math.round(progress * N);
  var flownPts  = all.slice(0, splitIdx + 1);
  var remainPts = all.slice(splitIdx);
  var flown  = L.polyline(flownPts,  { color:'#10b981', weight:2.5, opacity:0.9 });
  var remain = L.polyline(remainPts, { color:'#94a3b8', weight:2,   opacity:0.6, dashArray:'6,4' });
  flown.addTo(pathLayerGroup);
  remain.addTo(pathLayerGroup);
  drawnPaths[cs] = [flown, remain];
  document.getElementById('clearTrackBanner').style.display = 'flex';
}

function clearFlightPath(cs) {
  if (drawnPaths[cs]) {
    drawnPaths[cs].forEach(function(l) { pathLayerGroup.removeLayer(l); });
    delete drawnPaths[cs];
  }
  if (!Object.keys(drawnPaths).length) {
    document.getElementById('clearTrackBanner').style.display = 'none';
  }
}

  Object.keys(drawnPaths).forEach(clearFlightPath);

// Bearing (degrees) from point A to point B
function simBearing(from, to) {
  var dLon = (to[1] - from[1]) * Math.PI / 180;
  var la1  = from[0] * Math.PI / 180;
  var la2  = to[0]   * Math.PI / 180;
  var y    = Math.sin(dLon) * Math.cos(la2);
  var x    = Math.cos(la1) * Math.sin(la2) - Math.sin(la1) * Math.cos(la2) * Math.cos(dLon);
  return ((Math.atan2(y, x) * 180 / Math.PI) + 360) % 360;
}

// Linear interpolate between two [lat,lon] points
function simLerp(from, to, t) {
  t = Math.max(0, Math.min(1, t));
  return [from[0] + (to[0] - from[0]) * t, from[1] + (to[1] - from[1]) * t];
}

function loadSimFlights() {
  var elapsedSinceLoad = Math.floor((Date.now() - simPageStart) / 60000);

  simFlightsData.forEach(function(f) { try {
    var totalElapsed = f.elapsed0 + elapsedSinceLoad;
    var progress     = totalElapsed / f.totalMins;

    // Skip flights with missing coordinates
    if (!f.from || !f.to) return;

    if (progress >= 1) {
      // Flight has landed — remove marker if present
      if (simFlightMarkers[f.cs]) {
        flightLayer.removeLayer(simFlightMarkers[f.cs]);
        delete simFlightMarkers[f.cs];
      }
      return;
    }

    var pos     = simLerp(f.from, f.to, progress);
    var heading = simBearing(pos, f.to);
    var color   = f.color || (f.isKQ ? '#10b981' : '#818cf8');
    var size    = f.isKQ ? 26 : 20;

    if (simFlightMarkers[f.cs]) {
      // Slide existing marker to new position
      simFlightMarkers[f.cs].setLatLng(pos);
      if (simFlightMarkers[f.cs].setRotationAngle) {
        simFlightMarkers[f.cs].setRotationAngle(heading);
      }
    } else {
      var remMins  = Math.round(f.totalMins - totalElapsed);
      var remStr   = remMins >= 60
        ? Math.floor(remMins / 60) + 'h ' + String(remMins % 60).padStart(2, '0') + 'm'
        : remMins + 'm';

      // Aircraft type — expand ICAO code to full name
      var acNames = {
        B738:'Boeing 737-800', B38M:'Boeing 737 MAX 8', B789:'Boeing 787-9',

        B752:'Boeing 757-200', A320:'Airbus A320',      A321:'Airbus A321',
        A333:'Airbus A330-300',A359:'Airbus A350-900',  E190:'Embraer 190',
        E195:'Embraer 195',    AT76:'ATR 72-600',       AT75:'ATR 72-500',
        DH8D:'Dash 8-400',     CRJ9:'CRJ-900',          CRJ7:'CRJ-700'
      };
      var acFull = acNames[f.ac] || f.ac;

      // Estimated altitude based on flight progress curve
      var pct = totalElapsed / f.totalMins;
      var estAlt;
      if      (pct < 0.10) estAlt = Math.round(pct / 0.10 * 35000);
      else if (pct > 0.90) estAlt = Math.round((1 - pct) / 0.10 * 35000);
      else                 estAlt = 33000 + Math.round(Math.sin(pct * Math.PI) * 2000);
      var altStr = estAlt > 500
        ? 'FL' + String(Math.round(estAlt / 100)).padStart(3, '0')
        : 'Descending';

      // Estimated speed
      var estSpd = pct < 0.10 ? Math.round(200 + pct / 0.10 * 250)
                 : pct > 0.90 ? Math.round(200 + (1 - pct) / 0.10 * 250)
                 : 450;

      // Departure time display
      var depStr = '';
      if (f.depTime) {

      var destLbl = (f.destCode || '') + (f.destCity ? ' · ' + f.destCity : '');

        '<div style="font-size:10.5px;color:var(--text-2);margin-bottom:10px;">' + acFull + '</div>' +

        // ── Route ───────────────────────────────────────────────
        '<div style="background:var(--bg-2,rgba(255,255,255,.05));border-radius:6px;padding:8px 10px;margin-bottom:10px;">' +
          '<div style="display:flex;align-items:center;justify-content:space-between;gap:6px;">' +
            '<div style="text-align:left;min-width:0;">' +
              '<div style="font-size:16px;font-weight:800;color:var(--text);">' + (f.origCode || '—') + '</div>' +
              '<div style="font-size:9.5px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:80px;" title="' + (f.origName || '') + '">' + (f.origCity || '') + '</div>' +
            '</div>' +

              '<div style="font-size:11px;color:var(--text-3);">✈</div>' +
              '<div style="height:1px;background:var(--border,rgba(255,255,255,.1));margin:2px 4px;position:relative;">' +
                '<div style="position:absolute;top:-2px;left:' + progPct + '%;width:5px;height:5px;background:' + (f.isKQ ? '#10b981' : '#818cf8') + ';border-radius:50%;transform:translateX(-50%);"></div>' +

function injectRealKQFlights() {
  fetch('/kq_flights_live.json')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var allFlights = (data.scheduled || []).concat(data.flights || []);
      var now = Date.now();

      // Remove existing simulated KQ flights so real ones replace them
      simFlightsData = simFlightsData.filter(function(f) { return !f.isKQ; });

      allFlights.forEach(function(fl) {
        var origIcao = fl.origin      && fl.origin.code_icao;
        var destIcao = fl.destination && fl.destination.code_icao;
        if (!origIcao || !destIcao || !AP[origIcao] || !AP[destIcao]) return;

        var depMs     = fl.scheduled_off ? new Date(fl.scheduled_off).getTime() : now;
        var totalMins = fl.filed_ete    ? Math.round(fl.filed_ete / 60) : 120;
        var elapsed0  = Math.max(0, Math.floor((now - depMs) / 60000));

        // Skip already-landed flights
        if (elapsed0 >= totalMins) return;

        simFlightsData.push({
          cs:        fl.ident_iata || fl.ident_icao || fl.ident,
          op:        'Kenya Airways',
          ac:        fl.aircraft_type || 'B738',
          from:      AP[origIcao],
          to:        AP[destIcao],
          totalMins: totalMins,
          elapsed0:  elapsed0,
          isKQ:      true,
          origCode:  fl.origin.code_iata      || origIcao,
          destCode:  fl.destination.code_iata || destIcao,
          origCity:  fl.origin.city           || origIcao,
          destCity:  fl.destination.city      || destIcao,
          origName:  fl.origin.name           || '',
          destName:  fl.destination.name      || '',
          depTime:   fl.scheduled_off         || null
        });
      });

      loadSimFlights();
      console.log('KQ real flights loaded:', simFlightsData.filter(function(f){ return f.isKQ; }).length);
    })
    .catch(function(e) {
      console.warn('kq_flights_live.json unavailable — keeping simulated KQ flights:', e.message);
    });
}

 function getRiskLevel(score) {
  if (score >= 21) return "Extreme";
  if (score >= 12) return "High";
  if (score >= 6) return "Moderate";
  return "Low";
}

/* ── Risk Matrix helpers ── */
function getMatrixCell(score) {
  // Find L,I ∈ [1,5] where L×I is closest to score; prefer balanced (near diagonal)
  var best = [3, 3], bestErr = Infinity;
  for (var L = 1; L <= 5; L++) {
    for (var I = 1; I <= 5; I++) {
      var err = Math.abs(L * I - score);
      var bal = Math.abs(L - I);
      if (err < bestErr || (err === bestErr && bal < Math.abs(best[0] - best[1]))) {
        bestErr = err; best = [L, I];
      }
    }
  }
  return best;
}

function buildRiskMatrix(score) {
  var cell     = getMatrixCell(score);
  var hl = cell[0], hi = cell[1];
  var zoneBg   = function(v){ return v>=21?'#dc2626':v>=12?'#ea580c':v>=6?'#d97706':'#16a34a'; };
  var lvlLabel = score>=21?'EXTREME':score>=12?'HIGH':score>=6?'MEDIUM':'LOW';
  var lvlColor = zoneBg(score);
  // Short labels — no overflow
  var lLbls = ['Rare','Unlikely','Possible','Likely','Certain'];
  var iLbls = ['Negligible','Minor','Major','Hazardous','Catastrophic'];

  // Column headers: number only (full name in title tooltip)
  var th = '<th class="rm-corner">Likelihood&nbsp;↓<br>Impact&nbsp;→</th>';
  for (var I = 1; I <= 5; I++) {
    th += '<th class="rm-th" title="' + iLbls[I-1] + '">' + I + '</th>';
  }

  var tbody = '';
  for (var L = 1; L <= 5; L++) {
    // Row header: bold number + small label below
    var tr = '<td class="rm-lh" title="' + lLbls[L-1] + '"><b>' + L + '</b>' + lLbls[L-1] + '</td>';
    for (var II = 1; II <= 5; II++) {
      var v      = L * II;
      var active = (L === hl && II === hi);
      var style  = 'background:' + zoneBg(v) + ';' +
                   (active
                     ? 'opacity:1;box-shadow:0 0 0 2px white,0 0 0 3.5px ' + zoneBg(v) + ';position:relative;z-index:1;'
                     : 'opacity:.42;font-weight:400;');
      tr += '<td class="rm-cell" style="' + style + '">' + v + '</td>';
    }
    tbody += '<tr>' + tr + '</tr>';
  }

  // Colour-band legend
  var legend =
    '<div style="display:flex;gap:8px;margin-top:5px;flex-wrap:wrap;">' +
      '<span style="font-size:8px;color:var(--text-3);display:flex;align-items:center;gap:3px;"><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:#16a34a;"></span>Low</span>' +
      '<span style="font-size:8px;color:var(--text-3);display:flex;align-items:center;gap:3px;"><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:#d97706;"></span>Medium</span>' +
      '<span style="font-size:8px;color:var(--text-3);display:flex;align-items:center;gap:3px;"><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:#ea580c;"></span>High</span>' +
      '<span style="font-size:8px;color:var(--text-3);display:flex;align-items:center;gap:3px;"><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:#dc2626;"></span>Extreme</span>' +
    '</div>';

  return '<div class="rm-wrap">' +
    '<div class="rm-hdr">Risk Score: <b>' + score + '/25</b> &nbsp;|&nbsp; Risk Level: <b style="color:' + lvlColor + '">' + lvlLabel + '</b></div>' +
    '<table class="rm-tbl"><thead><tr>' + th + '</tr></thead><tbody>' + tbody + '</tbody></table>' +
    legend +
    '</div>';
}

function getType(feature) {
  const p = feature.properties;

  const typeMap = {
    1: "Restricted",
    2: "Danger",
    3: "Prohibited",
    4: "CTR",
    10: "FIR",
    13: "AFIS"
    
  };

  if (p.type !== undefined) {
    return typeMap[p.type] || "OTHER";
  }
}

}
function getACLEDColor(type) {

  if (!type) return "#999";

  type = type.toLowerCase();

  if (type.includes("battle")) return "#ef4444";        // red
  if (type.includes("violence")) return "#f97316";      // orange
  if (type.includes("protest")) return "#3b82f6";       // blue
  if (type.includes("riot")) return "#a855f7";          // purple

  return "#10b981"; // green default
}
function getFatalityColor(f) {
  f = Number(f);

  if (isNaN(f) || f === 0) return "#10b981";   // green
  if (f <= 1) return "#3b82f6";                // blue
  if (f <= 4) return "#f59e0b";                // amber
  if (f <= 10) return "#f97316";               // orange
  return "#ef4444";                            // red
}

// ── POPUP GUARD — keep popups out of the top-left control zone ──
// Protected zone: 330 px wide × 145 px tall (search bar + focus toggle + margin).
// Strategy 1: set autoPanPaddingTopLeft globally on every new popup.
// Strategy 2: on popupopen, detect screen overlap and pan the map to clear it.

// Global defaults — applies to every popup created after this point
if (L && L.Popup && L.Popup.prototype) {
  L.Popup.prototype.options.autoPan                   = true;
  L.Popup.prototype.options.autoPanPaddingTopLeft      = L.point(330, 145);
  L.Popup.prototype.options.autoPanPaddingBottomRight  = L.point(20, 20);
}

// Per-open check — handles markers that are already in-view near the controls
// (autoPanPadding alone won't fire when no viewport-edge clipping occurs)
map.on('popupopen', function (e) {
  requestAnimationFrame(function () {
    var GUARD_X = 330;   // px — search bar width + margin
    var GUARD_Y = 145;   // px — search (55 px) + focus toggle (105 px) + margin

    var popupEl = (e.popup.getElement ? e.popup.getElement() : null)
                  || document.querySelector('.leaflet-popup');
    if (!popupEl) return;

    var mapEl   = map.getContainer();
    var popRect = popupEl.getBoundingClientRect();
    var mapRect = mapEl.getBoundingClientRect();

    // Popup bounds relative to the map container origin
    var popLeft   = popRect.left   - mapRect.left;
    var popTop    = popRect.top    - mapRect.top;
    var popRight  = popRect.right  - mapRect.left;
    var popBottom = popRect.bottom - mapRect.top;

    var overlapsX = popLeft < GUARD_X && popRight  > 0;
    var overlapsY = popTop  < GUARD_Y && popBottom > 0;

    if (overlapsX && overlapsY) {
      // panBy([-x, -y]) shifts the viewport left/up → popup moves right/down on screen
      var shiftX = Math.ceil(GUARD_X - popLeft) + 20;
      var shiftY = Math.ceil(GUARD_Y - popTop)  + 20;
      map.panBy([-shiftX, -shiftY], { animate: true, duration: 0.25 });
    }
  });
});

  if (_dtfOpen && widget && !widget.contains(e.target)) {
    _dtfOpen = false;
    document.getElementById('dtf-dropdown').classList.remove('dtf-show');
    document.getElementById('dtf-trigger').classList.remove('dtf-open');
    ['acled','asn'].forEach(function(k) {
      document.getElementById('dtf-panel-' + k).classList.remove('dtf-panel-show');
      document.getElementById('dtf-item-' + k).classList.remove('dtf-active');
    });
    _dtfActivePanel = null;
  }
});

// Bucket accordion
function toggleBucket(id) {

// Called from parent index.html when role changes
function setMapRole(isOperator) {
  var lbl = document.getElementById('kqFilterLabel');
  if (lbl) lbl.textContent = isOperator ? 'My Flights (KQ)' : 'Kenya Airways';

// Map from IATA code (filter UI) → full airline name (stored on marker)
var IATA_TO_AIRLINE = {
  'KQ': 'Kenya Airways',
  'ET': 'Ethiopian Airlines',
  'U7': 'Uganda Airlines',
  'WB': 'RwandAir',
  'TC': 'Air Tanzania',
  'JM': 'Jambojet',
  'SL': 'Skyline Express',
  'PW': 'Precision Air',
};

var _flightFilter = 'all';
function setFlightFilter(mode) {
  _flightFilter = mode;
  applyFlightFilter();
}
function applyFlightFilter() {
  var targetAirline = _flightFilter === 'all' ? null : (IATA_TO_AIRLINE[_flightFilter] || _flightFilter);
  // Iterate simFlightMarkers directly — more reliable than flightLayer.eachLayer
  Object.keys(simFlightMarkers).forEach(function(cs) {
    var m = simFlightMarkers[cs];
    if (!m) return;
    var show = !targetAirline || m._airline === targetAirline;
    // Use display rather than opacity — works on DivIcon regardless of DOM state
    var el = m._icon || (m.getElement && m.getElement());
    if (el) {
      el.style.opacity = show ? '1' : '0.1';
      el.style.pointerEvents = show ? '' : 'none';
    }
  });
}

// Pulse animation icon
function makeFeedIcon(color) {
  var html = '<div style="width:18px;height:18px;border-radius:50%;background:' + color +
    ';border:2px solid white;box-shadow:0 0 0 3px ' + color + '44;"></div>';
  return L.divIcon({ html: html, className: '', iconSize: [18, 18], iconAnchor: [9, 9], popupAnchor: [0, -13] });
}

// Seed used so jitter is deterministic per page load
var _jSeed = 0;
function _jitter() { _jSeed++; return ((_jSeed * 9301 + 49297) % 233280 / 233280 - 0.5) * 1.4; }

_feedItems.forEach(function(item) {
  var base = _countryCoords[item.country];
  if (!base) return;
  var layer = _catLayerMap[item.cat];
  if (!layer) return;
  var marker = L.marker([base[0] + _jitter(), base[1] + _jitter()], { icon: makeFeedIcon(item.color) });
  marker.bindPopup(
    '<div style="font-family:\'Inter\',sans-serif;min-width:200px;">' +
    '<div style="font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:' + item.color + ';margin-bottom:5px;">' + item.cat + ' &nbsp;·&nbsp; ' + item.country + '</div>' +

    { autoPan: true, autoPanPaddingTopLeft: L.point(330, 140), autoPanPaddingBottomRight: L.point(20, 20) }
  );
  marker.addTo(layer);
});
