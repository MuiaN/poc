name: Deploy Front‑end to Server

on:
  push:
    branches: [ master ]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  deploy:
    runs-on: [self-hosted, frontend]   # runner labelled "frontend"
    env:
      SERVER_USER:       ${{ secrets.SERVER_USERNAME }}
      GIT_PAT:           ${{ secrets.GIT_PAT }}
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
      SESSION_SECRET:    ${{ secrets.SESSION_SECRET }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # --------------------------------------------------------------
      # 1️⃣  Pull latest code on the server (already cloned)
      # --------------------------------------------------------------
      - name: Pull latest code
        run: |
          cd /home/${{ secrets.SERVER_USERNAME }}/SA-Aviation-Intelligence-Platform/frontend
          git fetch origin
          git reset --hard origin/master

      - name: Write .env for build
        run: |
          cd /home/${{ secrets.SERVER_USERNAME }}/SA-Aviation-Intelligence-Platform/frontend
          cat > .env <<EOF
          NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          SESSION_SECRET=${{ secrets.SESSION_SECRET }}
          EOF

      # --------------------------------------------------------------
      # 2️⃣ Build front‑end image (Next.js standalone)
      # --------------------------------------------------------------
      - name: Build front‑end image
        run: |
          cd /home/${{ secrets.SERVER_USERNAME }}/SA-Aviation-Intelligence-Platform/frontend
          echo "🐳 Building front‑end image (Next.js standalone) ..."
          docker compose -f docker-compose.prod.yml build \
            --build-arg NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }} \
            --build-arg NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }} \
            --build-arg SESSION_SECRET=${{ secrets.SESSION_SECRET }} \
            frontend

      # --------------------------------------------------------------
      # 3️⃣ Start front‑end container
      # --------------------------------------------------------------
      - name: Start front‑end container
        run: |
          cd /home/${{ secrets.SERVER_USERNAME }}/SA-Aviation-Intelligence-Platform/frontend
          echo "🚀 Starting front‑end container..."
          docker compose -f docker-compose.prod.yml up -d --no-deps frontend

      # --------------------------------------------------------------
      # 4️⃣ Prune unused images
      # --------------------------------------------------------------
      - name: Prune unused images
        run: |
          docker image prune -af
          echo "✅ Front‑end deployment finished!"