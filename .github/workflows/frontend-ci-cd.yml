name: Deploy Front‑end to Server

on:
  push:
    branches: [ master ]          # we work on master, not main

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SERVER_HOST:       ${{ secrets.SERVER_HOST }}
      SERVER_USER:       ${{ secrets.SERVER_USERNAME }}
      SERVER_PORT:       ${{ secrets.SERVER_PORT }}
      SSH_KEY:           ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_PASSPHRASE:    ${{ secrets.SSH_PASSPHRASE }}
      GIT_PAT:           ${{ secrets.GIT_PAT }}
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------------
      # 1️⃣  Copy the whole repo to the server (so we can `git pull` there)
      # --------------------------------------------------------------
      - name: Upload repository to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host:            ${{ secrets.SERVER_HOST }}
          username:        ${{ secrets.SERVER_USERNAME }}
          port:            ${{ secrets.SERVER_PORT }}
          key:             ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase:      ${{ secrets.SSH_PASSPHRASE }}
          source:          "."
          target:          "/home/${{ secrets.SERVER_USERNAME }}/SA-Aviation-Intelligence-Platform/frontend"

      # --------------------------------------------------------------
      # 2️⃣  SSH → pull latest, write .env, build image, start container
      # --------------------------------------------------------------
      - name: SSH & Deploy Front‑end
        uses: appleboy/ssh-action@v0.1.10
        with:
          host:            ${{ secrets.SERVER_HOST }}
          username:        ${{ secrets.SERVER_USERNAME }}
          port:            ${{ secrets.SERVER_PORT }}
          key:             ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase:      ${{ secrets.SSH_PASSPHRASE }}
          script: |
            set -euo pipefail
            cd /home/${{ secrets.SERVER_USERNAME }}/SA-Aviation-Intelligence-Platform/frontend

            echo "🔄 Pulling latest code..."
            git fetch origin
            git reset --hard origin/master

            echo "🔐 Writing .env for build (NEXT_PUBLIC_API_URL)..."
            cat > .env <<'EOF'
NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
EOF

            echo "🐳 Building front‑end image (Next.js standalone) ..."
            docker compose -f docker-compose.prod.yml build \
              --build-arg NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }} \
              frontend

            echo "🚀 Starting front‑end container..."
            docker compose -f docker-compose.prod.yml up -d --no-deps frontend

            echo "🧹 Pruning unused images..."
            docker image prune -af

            echo "✅ Front‑end deployment finished!"