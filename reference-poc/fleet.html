<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fleet Register — FRED BLACK Aviation</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<script src="theme.js"></script>
<link rel="stylesheet" href="styles.css">
<style>
body { padding: 0; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }

/* ── Layout ─────────────────────────────────────── */
.fl-header {
  padding: 14px 20px 0;
  flex-shrink: 0;
}
.fl-controls {
  padding: 10px 20px 0;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  flex-shrink: 0;
}
.fl-body {
  flex: 1; overflow: hidden; display: flex; position: relative;
}
.fl-table-wrap {
  flex: 1; overflow-y: auto; padding: 0 20px 16px;
  transition: margin-right .3s;
}
.fl-body.panel-open .fl-table-wrap {
  margin-right: 420px;
}

/* ── KPI Strip ──────────────────────────────────── */
.kpi-strip {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 10px;
  padding: 12px 20px 0;
  flex-shrink: 0;
}
.kpi-mini {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 11px 14px;
  display: flex; align-items: center; gap: 10px;
  box-shadow: var(--shadow);
  transition: box-shadow .2s, border-color .2s;
  cursor: default;
}
.kpi-mini:hover { box-shadow: var(--shadow-md); border-color: var(--border-2); }
.kpi-mini-icon {
  width: 36px; height: 36px; border-radius: 9px;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.kpi-mini-icon svg { width: 18px; height: 18px; }
.kpi-mini-icon.blue   { background: var(--accent-dim); }
.kpi-mini-icon.green  { background: var(--success-dim); }
.kpi-mini-icon.amber  { background: var(--warn-dim); }
.kpi-mini-icon.red    { background: var(--danger-dim); }
.kpi-mini-icon.purple { background: rgba(139,92,246,.12); }
.kpi-mini-val  { font-size: 22px; font-weight: 700; line-height: 1; color: var(--text); }
.kpi-mini-lbl  { font-size: 10px; font-weight: 600; color: var(--text-2); margin-top: 2px; text-transform: uppercase; letter-spacing: .04em; }

/* ── Tab bar ────────────────────────────────────── */
.fl-tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); }
.fl-tab {
  font-size: 12px; font-weight: 600; font-family: var(--font-body);
  padding: 7px 16px; border: none; background: transparent;
  color: var(--text-2); cursor: pointer;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
  transition: color .15s, border-color .15s; white-space: nowrap;
}
.fl-tab:hover { color: var(--text); }
.fl-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.fl-tab .tc { font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 8px; margin-left: 4px; background: var(--bg-3); color: var(--text-3); }
.fl-tab.active .tc { background: var(--accent-dim); color: var(--accent); }

/* ── View toggle ────────────────────────────────── */
.view-toggle { display: flex; background: var(--bg-3); border-radius: 7px; padding: 2px; gap: 2px; margin-left: auto; }
.vt-btn {
  width: 30px; height: 26px; border: none; border-radius: 5px; background: transparent;
  color: var(--text-3); cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background .15s, color .15s;
}
.vt-btn svg { width: 14px; height: 14px; }
.vt-btn.active { background: var(--bg-2); color: var(--accent); box-shadow: 0 1px 3px rgba(0,0,0,.3); }

/* ── Add button ─────────────────────────────────── */
.add-btn {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 14px; background: var(--accent); color: #fff;
  border: none; border-radius: 7px; font-size: 12px; font-weight: 600;
  font-family: var(--font-body); cursor: pointer; transition: background .15s; white-space: nowrap;
}
.add-btn:hover { background: var(--accent-h); }
.add-btn svg { width: 13px; height: 13px; fill: none; stroke: #fff; stroke-width: 2.5; }

/* ── Main Table ─────────────────────────────────── */
.fleet-table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 12px; }
.fleet-table thead th {
  background: var(--bg-3); color: var(--text-2); font-size: 10px;
  font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
  padding: 9px 12px; border-bottom: 1px solid var(--border);
  text-align: left; white-space: nowrap; position: sticky; top: 0; z-index: 2;
}
.fleet-table thead th.sort-active { color: var(--accent); }
.fleet-table thead th.sortable { cursor: pointer; user-select: none; }
.fleet-table thead th.sortable:hover { color: var(--text); }
.sort-arrow { opacity: .4; font-size: 9px; margin-left: 2px; }
.fleet-table tbody td {
  padding: 10px 12px; border-bottom: 1px solid var(--border);
  color: var(--text); vertical-align: middle;
}
.fleet-table tbody tr:last-child td { border-bottom: none; }
.fleet-table tbody tr { cursor: pointer; transition: background .12s; }
.fleet-table tbody tr:hover td { background: var(--bg-hover); }
.fleet-table tbody tr.selected td { background: var(--accent-dim); }

.reg { font-weight: 700; font-family: 'Courier New', monospace; color: var(--accent); font-size: 12px; letter-spacing: .04em; }
.ac-type { font-weight: 600; color: var(--text); line-height: 1.3; }
.ac-type-sub { font-size: 10.5px; color: var(--text-3); margin-top: 1px; }
.op-chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 8px 2px 4px; border-radius: 12px; font-size: 10.5px; font-weight: 700;
  letter-spacing: .03em; white-space: nowrap;
}
.op-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.fl-num { font-size: 12px; font-weight: 600; color: var(--text); }
.fl-num-sub { font-size: 10px; color: var(--text-3); }

/* Status badges */
.st-badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 9px; border-radius: 20px; font-size: 10.5px; font-weight: 600; white-space: nowrap;
}
.st-badge::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
.st-active   { background: var(--success-dim); color: var(--success); }
.st-maint    { background: var(--warn-dim);    color: var(--warn); }
.st-grounded { background: var(--danger-dim);  color: var(--danger); }
.st-ferry    { background: var(--accent-dim);  color: var(--accent); }

/* Days countdown */
.days-pill {
  display: inline-block; padding: 2px 8px; border-radius: 4px;
  font-size: 11px; font-weight: 700; white-space: nowrap;
}
.days-ok   { background: var(--success-dim); color: var(--success); }
.days-warn { background: var(--warn-dim);    color: var(--warn); }
.days-red  { background: var(--danger-dim);  color: var(--danger); }

/* Risk score pill */
.risk-pill {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 700;
}
.risk-low  { background: rgba(16,185,129,.12); color: #10b981; }
.risk-mod  { background: rgba(245,158,11,.12); color: #f59e0b; }
.risk-high { background: rgba(249,115,22,.12); color: #f97316; }
.risk-ext  { background: rgba(239,68,68,.12);  color: #ef4444; }

/* Action button */
.row-act {
  width: 26px; height: 26px; border-radius: 5px; border: 1px solid var(--border);
  background: none; display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--text-3); transition: all .15s;
}
.row-act:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
.row-act svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2; }

/* Empty state */
.fl-empty { text-align: center; padding: 52px 20px; }
.fl-empty-icon { width: 44px; height: 44px; margin: 0 auto 12px; opacity: .25; }
.fl-empty-icon svg { width: 44px; height: 44px; fill: var(--text-3); }
.fl-empty-title { font-size: 13px; font-weight: 600; color: var(--text-2); margin-bottom: 4px; }
.fl-empty-sub   { font-size: 11.5px; color: var(--text-3); }

/* ── Card Grid View ─────────────────────────────── */
.ac-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; margin-top: 12px; }
.ac-card {
  background: var(--bg-2); border: 1px solid var(--border); border-radius: 10px;
  padding: 14px 15px; cursor: pointer; transition: box-shadow .15s, border-color .15s;
  box-shadow: var(--shadow);
}
.ac-card:hover { box-shadow: var(--shadow-md); border-color: var(--border-2); }
.ac-card.selected { border-color: var(--accent); background: rgba(26,111,232,.05); }
.ac-card-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 10px; }
.ac-card-reg { font-family: 'Courier New', monospace; font-size: 14px; font-weight: 700; color: var(--accent); letter-spacing: .04em; }
.ac-card-type { font-size: 11px; color: var(--text-3); margin-top: 2px; }
.ac-card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; margin-top: 8px; border-top: 1px solid var(--border); padding-top: 8px; }
.ac-card-field { font-size: 10px; color: var(--text-3); margin-bottom: 1px; }
.ac-card-val   { font-size: 11.5px; font-weight: 600; color: var(--text); }
.ac-card-bottom { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--border); }

/* ── Detail Panel ───────────────────────────────── */
.detail-panel {
  position: fixed; right: 0; top: 0; bottom: 0; width: 420px;
  background: var(--bg-2); border-left: 1px solid var(--border);
  box-shadow: -4px 0 24px rgba(0,0,0,.5);
  z-index: 50; overflow-y: auto;
  transform: translateX(100%);
  transition: transform .3s ease;
}
.detail-panel.open { transform: translateX(0); }
.dp-close {
  position: absolute; top: 12px; right: 14px; width: 28px; height: 28px;
  border-radius: 50%; border: 1px solid var(--border); background: var(--bg-3);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--text-2); transition: all .15s; z-index: 2;
}
.dp-close:hover { border-color: var(--danger); color: var(--danger); background: var(--danger-dim); }
.dp-close svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2.5; }

.dp-hero {
  padding: 18px 18px 14px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-3);
}
.dp-reg  { font-family: 'Courier New', monospace; font-size: 22px; font-weight: 700; color: var(--accent); letter-spacing: .05em; margin-bottom: 2px; }
.dp-type { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
.dp-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

/* Detail tabs */
.dp-tabs { display: flex; border-bottom: 1px solid var(--border); padding: 0 18px; }
.dp-tab {
  font-size: 12px; font-weight: 600; font-family: var(--font-body);
  padding: 9px 14px; border: none; background: transparent;
  color: var(--text-2); cursor: pointer;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
  transition: color .15s, border-color .15s;
}
.dp-tab:hover { color: var(--text); }
.dp-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

.dp-body { padding: 16px 18px; }

.dp-section { margin-bottom: 20px; }
.dp-section-title {
  font-size: 9.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase;
  color: var(--text-3); margin-bottom: 10px; padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
}
.dp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; }
.dp-field-lbl { font-size: 10px; color: var(--text-3); margin-bottom: 2px; font-weight: 500; }
.dp-field-val { font-size: 12.5px; font-weight: 600; color: var(--text); }
.dp-note {
  font-size: 12px; line-height: 1.65; color: var(--text-2);
  background: var(--bg-3); border-radius: 8px; padding: 11px 13px;
  border-left: 3px solid var(--border-2); margin-top: 4px;
}
.dp-note.warn-note { border-left-color: var(--warn); background: var(--warn-dim); color: var(--text); }
.dp-note.danger-note { border-left-color: var(--danger); background: var(--danger-dim); color: var(--text); }

/* Maintenance timeline */
.maint-row {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 12px;
}
.maint-row:last-child { border-bottom: none; }
.maint-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 4px;
}
.maint-type { font-weight: 600; color: var(--text); margin-bottom: 1px; }
.maint-date { font-size: 10.5px; color: var(--text-3); }
.maint-info { flex: 1; }

/* Policy detail rows */
.pol-row { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
.pol-row:last-child { border-bottom: none; }
.pol-lbl { color: var(--text-2); }
.pol-val { font-weight: 600; color: var(--text); }

/* History timeline */
.hist-item { display: flex; gap: 11px; padding: 9px 0; border-bottom: 1px solid var(--border); }
.hist-item:last-child { border-bottom: none; }
.hist-line { display: flex; flex-direction: column; align-items: center; gap: 2px; flex-shrink: 0; }
.hist-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.hist-vline { width: 1px; flex: 1; background: var(--border); margin-top: 2px; }
.hist-body { flex: 1; }
.hist-title { font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
.hist-desc  { font-size: 11px; color: var(--text-2); line-height: 1.5; }
.hist-date  { font-size: 10.5px; color: var(--text-3); margin-top: 3px; }

/* Risk mini-matrix inside panel */
.panel-rm { margin-top: 4px; }
.panel-rm .rm-hdr { font-size: 9.5px; color: var(--text-2); margin-bottom: 5px; font-weight: 500; }
.panel-rm .rm-tbl { border-collapse: separate; border-spacing: 2px; }
.panel-rm .rm-corner { font-size: 7px; font-weight: 500; color: var(--text-3); text-align: center; line-height: 1.3; padding: 0 2px 2px 0; vertical-align: bottom; width: 46px; }
.panel-rm .rm-th { font-size: 10px; font-weight: 700; color: var(--text-2); text-align: center; padding: 0 0 3px; }
.panel-rm .rm-lh { font-size: 8.5px; color: var(--text-2); text-align: right; padding-right: 4px; vertical-align: middle; line-height: 1.3; white-space: nowrap; width: 48px; }
.panel-rm .rm-lh b { display: block; font-size: 10px; font-weight: 700; color: var(--text); line-height: 1.1; }
.panel-rm .rm-cell { font-size: 10px; font-weight: 600; text-align: center; padding: 4px 2px; color: white; border-radius: 3px; vertical-align: middle; }

@keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.fleet-table tbody tr { animation: fadeUp .2s ease both; }
</style>
</head>
<body>

<!-- ── Page Header ──────────────────────────────────────────────── -->
<div class="fl-header">
  <div class="page-header" style="margin-bottom:0;">
    <div>
      <div class="page-title" id="pageTitle">Fleet Register</div>
      <div style="font-size:11.5px;color:var(--text-2);margin-top:2px;">Aircraft under management across all client operators</div>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <button class="btn" style="font-size:11.5px;" onclick="exportCSV()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="13" height="13"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Export CSV
      </button>
      <button class="add-btn">
        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add Aircraft
      </button>
    </div>
  </div>
</div>

<!-- ── KPI Strip ────────────────────────────────────────────────── -->
<div class="kpi-strip" id="kpiStrip"></div>

<!-- ── Controls ─────────────────────────────────────────────────── -->
<div class="fl-controls">
  <div class="fl-tabs" id="filterTabs" style="border-bottom:none;flex:1;flex-wrap:wrap;"></div>
  <div class="search-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input class="search-input" id="searchInput" placeholder="Search registration, type, operator…" oninput="applyFilters()">
  </div>
  <div class="view-toggle">
    <button class="vt-btn active" id="vt-table" onclick="setView('table')" title="Table view">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <button class="vt-btn" id="vt-cards" onclick="setView('cards')" title="Card view">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
    </button>
  </div>
</div>
<div style="height:1px;background:var(--border);margin:8px 20px 0;flex-shrink:0;"></div>

<!-- ── Body ─────────────────────────────────────────────────────── -->
<div class="fl-body" id="flBody">
  <div class="fl-table-wrap" id="flTableWrap">
    <!-- Table view -->
    <div id="viewTable">
      <table class="fleet-table" id="fleetTable">
        <thead>
          <tr>
            <th class="sortable" onclick="sortBy('reg')">Registration <span class="sort-arrow">↕</span></th>
            <th class="sortable" onclick="sortBy('type')">Type <span class="sort-arrow">↕</span></th>
            <th id="thOperator" class="sortable" onclick="sortBy('op')">Operator <span class="sort-arrow">↕</span></th>
            <th class="sortable" onclick="sortBy('yr')">Mfg Yr <span class="sort-arrow">↕</span></th>
            <th>Hours / Cycles</th>
            <th class="sortable" onclick="sortBy('status')">Status <span class="sort-arrow">↕</span></th>
            <th class="sortable" onclick="sortBy('maintDays')">Next Maint <span class="sort-arrow">↕</span></th>
            <th id="thPolicyExpiry" class="sortable" onclick="sortBy('polDays')">Policy Expiry <span class="sort-arrow">↕</span></th>
            <th class="sortable" onclick="sortBy('risk')">Risk <span class="sort-arrow">↕</span></th>
            <th></th>
          </tr>
        </thead>
        <tbody id="fleetBody"></tbody>
      </table>
      <div class="fl-empty" id="flEmpty" style="display:none;">
        <div class="fl-empty-icon"><svg viewBox="0 0 24 24"><path d="M21 16v-2l-8-5V3.5A1.5 1.5 0 0 0 11.5 2A1.5 1.5 0 0 0 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg></div>
        <div class="fl-empty-title">No aircraft match your search</div>
        <div class="fl-empty-sub">Try adjusting the filters or search term</div>
      </div>
    </div>
    <!-- Card view -->
    <div id="viewCards" style="display:none;">
      <div class="ac-grid" id="cardGrid"></div>
    </div>
  </div>

  <!-- Detail Panel -->
  <div class="detail-panel" id="detailPanel">
    <button class="dp-close" onclick="closePanel()">
      <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <div id="dpContent"></div>
  </div>
</div>

<script>
/* ════════════════════════════════════════════════════════════
   DATA
═══════════════════════════════════════════════════════════ */
const OP_META = {
  KQ: { name:'Kenya Airways',      color:'#1A6FE8', bg:'rgba(26,111,232,.12)'  },
  ET: { name:'Ethiopian Airlines', color:'#10B981', bg:'rgba(16,185,129,.12)'  },
  WB: { name:'RwandAir',           color:'#f97316', bg:'rgba(249,115,22,.12)'   },
  UR: { name:'Uganda Airlines',    color:'#F59E0B', bg:'rgba(245,158,11,.12)'   },
  TC: { name:'Air Tanzania',       color:'#1BB4E8', bg:'rgba(27,180,232,.12)'   },
  PW: { name:'Precision Air',      color:'#8B5CF6', bg:'rgba(139,92,246,.12)'   },
  JM: { name:'Jambojet',           color:'#06B6D4', bg:'rgba(6,182,212,.12)'    },
  FL: { name:'Flightlink',         color:'#38BDF8', bg:'rgba(56,189,248,.12)'   },
  AX: { name:'African Express',    color:'#EF4444', bg:'rgba(239,68,68,.12)'    },
};

const fleet = [
  /* ── Kenya Airways ─────────────────────────────────────────── */

    ['FL','Tanzania','5H-FDA', 1, 0,  2, 'D228', 2008, 8180,  'FL', [0,0]],
    // ── Top-up (other operators) ──
  ];

  const STATUSES = ['active','maintenance','grounded'];
  let polSeq = 800;

  BATCHES.forEach(function(b) {
    const [op, country, regPfx, regStart, regPad, count, typeCode, yrStart, msnStart, polPfx, statusPat] = b;
    const t = T[typeCode];
    for (let i = 0; i < count; i++) {
      const regNum = regStart + i;
      const reg = regPfx.replace(/\d+$/, '') + (regPad ? String(regNum).padStart(2,'0') : regNum);
      const yr = yrStart + (i % 4);
      const hours = (2026 - yr) * 3000 + (i * 400) % 8000;
      const cycles = Math.round(hours / 4.2);
      const maintDaysVal = 30 + (i * 17) % 120;
      const risk = Math.min(22, t.base_risk + (i % 4));
      const statusIdx = statusPat[i % statusPat.length];
      const status = STATUSES[statusIdx] || 'active';

      fleet.push({
        reg: reg,
        type: t.name,
        short: typeCode,
        op: op,
        country: country,
        yr: yr,
        msn: String(msnStart + i),
        engines: t.engines,
        seats: t.seats,
        status: status,
        lastInsp: inspDate(i),
        nextMaint: maintDate(i + 2),
        maintDays: maintDaysVal,
        polId: polPfx + '-HULL-2024-' + String(polSeq++).padStart(3,'0'),
        polExp: '31 Dec 2026',
        polDays: 180 + (i * 11) % 80,
        hullVal: '$' + (t.hull + (i % 5) * 2) + 'M',
        liabVal: '$' + t.liab + 'M',
        hours: hours,
        cycles: cycles,
        risk: risk,
        riskNote: status === 'grounded' ? 'Aircraft grounded — awaiting maintenance clearance.'
                 : status === 'maintenance' ? 'Scheduled maintenance in progress. Policy current.'
                 : 'Policy current. No open claims. Routine operations.',
        history: [],
      });
    }
  });
})();

function riskClass(r)  { return r>=21?'risk-ext':r>=12?'risk-high':r>=6?'risk-mod':'risk-low'; }
function riskLabel(r)  { return r>=21?'Extreme':r>=12?'High':r>=6?'Medium':'Low'; }
function riskColor(r)  { return r>=21?'#ef4444':r>=12?'#f97316':r>=6?'#f59e0b':'#10b981'; }
function dayClass(d)   { return d<14?'days-red':d<45?'days-warn':'days-ok'; }
function polDayClass(d){ return d<30?'days-red':d<60?'days-warn':'days-ok'; }
function statusBadge(s){
  const m = {active:'st-active Active',maintenance:'st-maint Maintenance',grounded:'st-grounded Grounded',ferry:'st-ferry Ferry'};
  const p = (m[s]||'st-active Active').split(' ');
  return `<span class="st-badge ${p[0]}">${p[1]}</span>`;
}
function opChip(code) {
  const o = OP_META[code]||{name:code,color:'#64748b',bg:'rgba(100,116,139,.12)'};
  return `<span class="op-chip" style="background:${o.bg};color:${o.color}"><span class="op-dot" style="background:${o.color}"></span>${code} · ${o.name}</span>`;
}
function fmtHours(h) { return h.toLocaleString()+'h'; }
function fmtCyc(c)   { return c.toLocaleString()+'c'; }

/* Risk matrix (self-contained) */
function getCell(score) {
  var best=[3,3],bestErr=Infinity;
  for(var L=1;L<=5;L++) for(var I=1;I<=5;I++){
    var e=Math.abs(L*I-score),b=Math.abs(L-I);
    if(e<bestErr||(e===bestErr&&b<Math.abs(best[0]-best[1]))){bestErr=e;best=[L,I];}
  }
  return best;
}
function buildMatrix(score) {
  var cell=getCell(score),hl=cell[0],hi=cell[1];
  var zBg=function(v){return v>=21?'#dc2626':v>=12?'#ea580c':v>=6?'#d97706':'#16a34a';};
  var lv=score>=21?'EXTREME':score>=12?'HIGH':score>=6?'MEDIUM':'LOW';
  var lc=zBg(score);
  var lLbls=['Rare','Unlikely','Possible','Likely','Certain'];
  var iLbls=['Negligible','Minor','Major','Hazardous','Catastrophic'];
  var th='<th class="rm-corner">Lkhd&nbsp;↓<br>Impact&nbsp;→</th>';
  for(var I=1;I<=5;I++) th+='<th class="rm-th" title="'+iLbls[I-1]+'">'+I+'</th>';
  var tb='';
  for(var L=1;L<=5;L++){
    var tr='<td class="rm-lh" title="'+lLbls[L-1]+'"><b>'+L+'</b>'+lLbls[L-1]+'</td>';
    for(var II=1;II<=5;II++){
      var v=L*II,a=(L===hl&&II===hi);
      var st='background:'+zBg(v)+';'+(a?'opacity:1;box-shadow:0 0 0 2px white,0 0 0 3.5px '+zBg(v)+';position:relative;z-index:1;':'opacity:.42;font-weight:400;');
      tr+='<td class="rm-cell" style="'+st+'">'+v+'</td>';
    }
    tb+='<tr>'+tr+'</tr>';
  }
  var legend='<div style="display:flex;gap:8px;margin-top:5px;flex-wrap:wrap;">'
    +'<span style="font-size:8px;color:var(--text-3);display:flex;align-items:center;gap:3px;"><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:#16a34a;"></span>Low</span>'
    +'<span style="font-size:8px;color:var(--text-3);display:flex;align-items:center;gap:3px;"><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:#d97706;"></span>Medium</span>'
    +'<span style="font-size:8px;color:var(--text-3);display:flex;align-items:center;gap:3px;"><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:#ea580c;"></span>High</span>'
    +'<span style="font-size:8px;color:var(--text-3);display:flex;align-items:center;gap:3px;"><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:#dc2626;"></span>Extreme</span>'
    +'</div>';
  return '<div class="panel-rm">'
    +'<div class="rm-hdr">Risk Score: <b>'+score+'/25</b> &nbsp;|&nbsp; Risk Level: <b style="color:'+lc+'">'+lv+'</b></div>'
    +'<table style="width:100%;border-collapse:separate;border-spacing:2px;table-layout:fixed;"><thead><tr>'+th+'</tr></thead><tbody>'+tb+'</tbody></table>'
    +legend+'</div>';
}

/* ════════════════════════════════════════════════════════════
   FILTER + SORT + RENDER TABLE
═══════════════════════════════════════════════════════════ */
function getFiltered() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  return fleetBase().filter(a => {
    const op = OP_META[a.op]||{name:a.op};
    const matchFilter =
      currentFilter === 'all'  ||
      (currentFilter === 'active'      && a.status === 'active')      ||
      (currentFilter === 'maintenance' && a.status === 'maintenance') ||
      (currentFilter === 'grounded'    && a.status === 'grounded')    ||
      (currentFilter === 'expiring'    && a.polDays < 60);
    const matchSearch = !q || [a.reg, a.type, a.short, op.name, a.op, a.country, a.status].some(s=>s.toLowerCase().includes(q));
    return matchFilter && matchSearch;
  }).sort((a,b) => {
    const k = currentSort.key;
    let va, vb;
    if(k==='reg')      { va=a.reg; vb=b.reg; }
    else if(k==='type'){ va=a.short; vb=b.short; }
    else if(k==='op')  { va=a.op; vb=b.op; }
    else if(k==='yr')  { va=a.yr; vb=b.yr; }
    else if(k==='status'){ va=a.status; vb=b.status; }
    else if(k==='maintDays'){ va=a.maintDays; vb=b.maintDays; }
    else if(k==='polDays'){ va=a.polDays; vb=b.polDays; }
    else if(k==='risk'){ va=a.risk; vb=b.risk; }
    else { va=a.reg; vb=b.reg; }
    if(typeof va==='string') return currentSort.dir * va.localeCompare(vb);
    return currentSort.dir * (va - vb);
  });
}

function applyFilters() {
  renderTabs();
  const data = getFiltered();
  if(currentView==='table') renderTable(data);
  else renderCards(data);
}

  selectedReg = null;

        <div class="dp-section-title">Policy Details</div>
        <div class="pol-row"><span class="pol-lbl">Policy ID</span><span class="pol-val" style="font-family:monospace;color:var(--accent);font-size:11.5px;">${a.polId}</span></div>
        <div class="pol-row"><span class="pol-lbl">Policy Status</span><span class="pol-val">${statusBadge(a.polDays>0?'active':'grounded')}</span></div>
        <div class="pol-row"><span class="pol-lbl">Expiry Date</span><span class="pol-val">${a.polExp}</span></div>
        <div class="pol-row"><span class="pol-lbl">Days Remaining</span><span class="pol-val"><span class="days-pill ${pColor}">${a.polDays>0?a.polDays+' days':'Expired'}</span></span></div>
      </div>
      <div class="dp-section">
        <div class="dp-section-title">Coverage & Values</div>
        <div class="pol-row"><span class="pol-lbl">Hull Insured Value</span><span class="pol-val" style="color:var(--success);font-size:13px;">${a.hullVal}</span></div>
        <div class="pol-row"><span class="pol-lbl">Liability Cover</span><span class="pol-val" style="color:var(--accent);font-size:13px;">${a.liabVal}</span></div>
        <div class="pol-row"><span class="pol-lbl">Operator</span><span class="pol-val">${opChip(a.op)}</span></div>
        <div class="pol-row"><span class="pol-lbl">Country</span><span class="pol-val">${a.country}</span></div>
      </div>
      ${a.polDays<60?`<div class="dp-note ${a.polDays<30?'danger-note':'warn-note'}">⚠ Policy expires in <b>${a.polDays} days</b>. Initiate renewal process immediately to avoid coverage gap.</div>`:''}`;
  } else if(dpTab==='history') {
    body = `
      <div class="dp-section">
        <div class="dp-section-title">Event History</div>
        <div>${(a.history||[]).map((h,i)=>{
          const dotCol = h.type==='danger'?'#ef4444':h.type==='warn'?'#f59e0b':h.type==='success'?'#10b981':'#1A6FE8';
          const isLast = i===(a.history.length-1);
          return `<div class="hist-item">
            <div class="hist-line">
              <div class="hist-dot" style="background:${dotCol}"></div>
              ${!isLast?'<div class="hist-vline"></div>':''}
            </div>
            <div class="hist-body">
              <div class="hist-title">${h.title}</div>
              <div class="hist-desc">${h.desc}</div>
              <div class="hist-date">${h.date}</div>
            </div>
          </div>`;
        }).join('')}</div>
      </div>`;
  }

  document.getElementById('dpContent').innerHTML = `
    <div class="dp-hero">
      <div class="dp-reg">${a.reg}</div>
      <div class="dp-type">${a.type}</div>
      <div class="dp-meta">
        ${opChip(a.op)}
        ${statusBadge(a.status)}
        <span class="risk-pill ${riskClass(a.risk)}" style="font-size:10.5px;">${a.risk}/25 ${riskLabel(a.risk)}</span>
      </div>
    </div>
    <div class="dp-tabs">${tabHtml}</div>
    <div class="dp-body">${body}</div>`;
}

/* ════════════════════════════════════════════════════════════
   SORT
═══════════════════════════════════════════════════════════ */
function sortBy(key) {
  if(currentSort.key===key) currentSort.dir *= -1;
  else { currentSort.key=key; currentSort.dir=1; }
  document.querySelectorAll('.fleet-table thead th').forEach(th=>th.classList.remove('sort-active'));
  applyFilters();
}

/* ════════════════════════════════════════════════════════════
   FILTER + VIEW
═══════════════════════════════════════════════════════════ */
function setFilter(f) {
  currentFilter = f;
  applyFilters();
}

function setView(v) {
  currentView = v;
  document.getElementById('viewTable').style.display = v==='table' ? '' : 'none';
  document.getElementById('viewCards').style.display = v==='cards' ? '' : 'none';
  document.getElementById('vt-table').classList.toggle('active', v==='table');
  document.getElementById('vt-cards').classList.toggle('active', v==='cards');
  applyFilters();
}

/* ════════════════════════════════════════════════════════════
   EXPORT CSV
═══════════════════════════════════════════════════════════ */
function exportCSV() {
  const cols = ['Registration','Type','Operator','Country','Mfg Year','MSN','Engines','Seats','Status','Hours','Cycles','Last Inspection','Next Maintenance','Maint Days','Policy ID','Policy Expiry','Policy Days','Hull Value','Liability','Risk Score'];
  const rows = fleet.map(a=>[a.reg,a.type,OP_META[a.op]?OP_META[a.op].name:a.op,a.country,a.yr,a.msn,a.engines,a.seats,a.status,a.hours,a.cycles,a.lastInsp,a.nextMaint,a.maintDays,a.polId,a.polExp,a.polDays,a.hullVal,a.liabVal,a.risk]);
  const csv = [cols,...rows].map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
  a.download = 'fleet-register-' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
}

   INIT
═══════════════════════════════════════════════════════════ */
// Read role from URL param (set by parent when navigating to fleet page)
(function() {
  const p = new URLSearchParams(window.location.search);
  if (p.get('op') === 'KQ') {
    operatorKQ = true;
    const h = document.getElementById('pageTitle');
    if (h) h.textContent = 'Kenya Airways Fleet Register';
    const th = document.getElementById('thPolicyExpiry');
    if (th) th.style.display = 'none';
    const opTh = document.getElementById('thOperator');
    if (opTh) opTh.style.display = 'none';
  }
})();
renderKPIs();
renderTabs();
applyFilters();
</script>
