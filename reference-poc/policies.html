<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Insurance Portfolio</title>
<script src="theme.js"></script>
<link rel="stylesheet" href="styles.css">
<style>
html,body{height:100%;overflow:hidden}

.content{height:100%;overflow-y:auto;padding:18px 22px;display:flex;flex-direction:column;gap:14px}

.top-strip{display:grid;grid-template-columns:1fr 200px 200px 200px;gap:12px;align-items:stretch}
.welcome-card{background:var(--bg-2);border:1px solid var(--border);border-radius:12px;padding:16px 20px;display:flex;flex-direction:column;justify-content:center;box-shadow:var(--shadow)}
.welcome-card h2{font-family:'Inter',sans-serif;font-size:19px;font-weight:700;margin-bottom:3px;color:var(--text)}
.welcome-card p{font-size:12px;color:var(--text-2)}

.panel{background:var(--bg-2);border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.phdr{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.phdr-title{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text-2)}
.phdr-link{font-size:11px;font-weight:600;color:var(--accent);cursor:pointer;background:none;border:none;font-family:'Inter',sans-serif}

.cnf-btn{font-size:11px;font-weight:600;padding:4px 11px;border-radius:4px;border:1px solid var(--border-2);background:var(--bg-3);color:var(--text-2);cursor:pointer;transition:background .15s,color .15s,border-color .15s;font-family:'Inter',sans-serif}
.cnf-btn:hover{border-color:var(--accent);color:var(--accent)}
.cnf-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}

.pol-search{display:flex;align-items:center;gap:7px;background:var(--bg-3);border:1px solid var(--border-2);border-radius:8px;padding:6px 12px;width:220px}
.pol-search svg{width:13px;height:13px;stroke:var(--text-2);fill:none;flex-shrink:0}
.pol-search input{border:none;background:transparent;outline:none;font-size:12px;color:var(--text);font-family:'Inter',sans-serif;width:100%}
.pol-search input::placeholder{color:var(--text-3)}

.pol-table{width:100%;border-collapse:collapse;font-size:12px}
.pol-table th{color:var(--text-2);font-weight:600;font-size:10px;letter-spacing:.05em;text-transform:uppercase;padding:8px 14px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap;background:var(--bg-3)}
.pol-table td{padding:11px 14px;border-bottom:1px solid var(--border);color:var(--text)}
.pol-table tr:last-child td{border-bottom:none}
.pol-table tr:hover td{background:var(--bg-hover);cursor:pointer}
.pol-id{font-weight:700;color:var(--accent);white-space:nowrap}
.pol-period{color:var(--text-3);font-size:12px;white-space:nowrap}
.pol-expiry{font-weight:700;white-space:nowrap;color:var(--text)}
.pol-expiry.red{color:var(--danger)}
.pol-expiry.amber{color:var(--warn)}

.ins-badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:600;white-space:nowrap}
.ins-badge.active {background:var(--success-dim);color:var(--success)}
.ins-badge.renew  {background:var(--warn-dim);   color:var(--warn)}
.ins-badge.expired{background:var(--danger-dim); color:var(--danger)}
.ins-badge.pending{background:var(--accent-dim); color:var(--accent)}

.empty{padding:48px 20px;text-align:center;color:var(--text-2);font-size:13px}

@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.panel,.top-strip>*{animation:fadeUp .3s ease both}
.top-strip>*:nth-child(2){animation-delay:.05s}
.top-strip>*:nth-child(3){animation-delay:.10s}
.top-strip>*:nth-child(4){animation-delay:.15s}
</style>
</head>
<body>

  <!-- Policies panel -->

    <div class="phdr">
      <span class="phdr-title">All Policies</span>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
        <!-- Filter tabs -->
        <div style="display:flex;gap:4px;">

          <button class="cnf-btn" onclick="setTab('Active',this)">Active</button>
          <button class="cnf-btn" onclick="setTab('Renew Soon',this)">Renew Soon</button>
          <button class="cnf-btn" onclick="setTab('Expired',this)">Expired</button>
          <button class="cnf-btn" onclick="setTab('Pending',this)">Pending</button>
        </div>
        <!-- Search -->
        <div class="pol-search">
          <svg viewBox="0 0 24 24" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input id="polSearch" type="text" placeholder="Search client, aircraft, ID…" oninput="filterPolicies()">
        </div>
      </div>
    </div>
    <table class="pol-table">
      <thead>
        <tr>
          <th>Policy ID</th>
          <th>Client</th>
          <th>Aircraft</th>
          <th>Coverage</th>
          <th>Insurance Period</th>
          <th>Expiry</th>
          <th>Status</th>
        </tr>

      <tbody id="polBody"></tbody>
    </table>
  </div>

</div>

let activeTab = 'all';

function renderTable(data) {
  const tbody = document.getElementById('polBody');
  if (!data.length) {
    tbody.innerHTML = `<tr><td colspan="7" class="empty">No policies match your search.</td></tr>`;
    return;
  }
  tbody.innerHTML = data.map(p => `
    <tr>
      <td class="pol-id">${p.id}</td>
      <td>${p.client}</td>
      <td style="color:var(--muted);font-size:12px">${p.ac}</td>
      <td>${p.cov}</td>
      <td class="pol-period">${p.period}</td>
      <td class="pol-expiry ${p.exp}">${p.expiry}</td>
      <td><span class="ins-badge ${
        p.status === 'Active'     ? 'active'  :
        p.status === 'Expired'    ? 'expired' :
        p.status === 'Renew Soon' ? 'renew'   : 'pending'
      }">${p.status}</span></td>
    </tr>`).join('');
}

function filterPolicies() {
  const q = document.getElementById('polSearch').value.trim().toLowerCase();
  let data = activeTab === 'all' ? policies : policies.filter(p => p.status === activeTab);
  if (q) data = data.filter(p =>
    p.id.toLowerCase().includes(q) ||
    p.client.toLowerCase().includes(q) ||
    p.ac.toLowerCase().includes(q) ||
    p.cov.toLowerCase().includes(q)
  );
  renderTable(data);
}

function setTab(tab, el) {
  activeTab = tab;
  document.querySelectorAll('.cnf-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('polSearch').value = '';
  filterPolicies();
}

renderTable(policies);
</script>
